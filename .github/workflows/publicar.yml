name: Publicar site

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "Link temporario do site-dist.zip (SharePoint 3. MODELOS/SITE/github)"
        required: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Baixar e conferir o site
        env:
          ZIP_URL: ${{ inputs.zip_url }}
        run: |
          curl -fsSL "$ZIP_URL" -o /tmp/site.zip
          rm -rf /tmp/site && mkdir /tmp/site && unzip -q /tmp/site.zip -d /tmp/site
          test -f /tmp/site/index.html
          test -d /tmp/site/assinatura || { echo "Falta a pasta assinatura/ (imagens da assinatura de e-mail)"; exit 1; }

      - name: Guardar os arquivos no repositorio
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/site/. .
          git config user.name "Victor Correia Santos"
          git config user.email "atendimento@correialamunier.com"
          git add -A
          git diff --cached --quiet || git commit -m "Atualiza o site ($(date -u +%Y-%m-%d))"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/site
      - id: deploy
        uses: actions/deploy-pages@v4
